      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?Run python3 classic.py up}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${WEB_SECRET:?Run python3 classic.py up}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
