    image: northwind-classic-spark:3.5.8
    container_name: northwind_classic_spark_master
    command: '/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080

      '
    restart: unless-stopped
    environment:
      sql_server_host: northwind_sqlserver,1433
