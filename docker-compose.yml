name: northwind_classic
services:
  northwind_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: northwind_classic_northwind_sqlserver
    environment:
      TZ: Asia/Tehran
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Run python3 classic.py up}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: 'true'
      MSSQL_MEMORY_LIMIT_MB: '2048'
    ports:
    - 127.0.0.1:${SQL_PORT:-14332}:1433
    volumes:
    - northwind_sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 6 -Q "SELECT 1" >/dev/null
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 90s
  northwind_postgres:
    image: postgres:16
    container_name: northwind_classic_northwind_postgres
    environment:
      TZ: Asia/Tehran
      POSTGRES_DB: Staging_Northwind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 classic.py up}
    ports:
    - 127.0.0.1:${PG_PORT:-5434}:5432
    volumes:
    - northwind_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 40s
  airflow-db:
    image: postgres:16
    container_name: northwind_classic_airflow_db
    environment:
      TZ: Asia/Tehran
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Run python3 classic.py up}
    volumes:
    - airflow_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 40s
  airflow-webserver:
    image: northwind-classic-airflow:2.10.5
    container_name: northwind_classic_airflow_webserver
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      sql_server_host: northwind_sqlserver,1433
      sql_server_user: sa
      sql_server_password: ${SQLSERVER_PASSWORD:?Run python3 classic.py up}
      sql_server_source_db: Northwind
      sql_server_dw_db: NorthwindDW
      postgres_host: northwind_postgres
      postgres_port: '5432'
      postgres_db: Staging_Northwind
      postgres_user: postgres
      postgres_password: ${POSTGRES_PASSWORD:?Run python3 classic.py up}
      clickhouse_host: northwind_clickhouse
      clickhouse_port: '8123'
      clickhouse_database: northwind_dw
      clickhouse_user: clickhouse
      clickhouse_password: ${CLICKHOUSE_PASSWORD:?Run python3 classic.py up}
      kafka_bootstrap_servers: northwind_kafka:19092
      TZ: Asia/Tehran
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD_URI:?Run python3 classic.py up}@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?Run python3 classic.py up}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${WEB_SECRET:?Run python3 classic.py up}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Tehran
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Tehran
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__CORE__PARALLELISM: '3'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      PYTHONPATH: /opt/airflow/scripts
    ports:
    - 127.0.0.1:${AIRFLOW_PORT:-8080}:8080
    volumes:
    - airflow_logs:/opt/airflow/logs
    command:
    - webserver
    - --pid
    - /opt/airflow/run/webserver.pid
    restart: unless-stopped
    build:
      context: .
      dockerfile: airflow/Dockerfile
    tmpfs:
    - /opt/airflow/run:uid=50000,gid=0,mode=1777
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request as u; u.urlopen('http://localhost:8080/health',timeout=4)"
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 90s
  airflow-scheduler:
    image: northwind-classic-airflow:2.10.5
    container_name: northwind_classic_airflow_scheduler
    group_add:
    - ${DOCKER_GID:?Run python3 classic.py up}
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      sql_server_host: northwind_sqlserver,1433
      sql_server_user: sa
      sql_server_password: ${SQLSERVER_PASSWORD:?Run python3 classic.py up}
      sql_server_source_db: Northwind
      sql_server_dw_db: NorthwindDW
      postgres_host: northwind_postgres
      postgres_port: '5432'
      postgres_db: Staging_Northwind
      postgres_user: postgres
      postgres_password: ${POSTGRES_PASSWORD:?Run python3 classic.py up}
      clickhouse_host: northwind_clickhouse
      clickhouse_port: '8123'
      clickhouse_database: northwind_dw
      clickhouse_user: clickhouse
      clickhouse_password: ${CLICKHOUSE_PASSWORD:?Run python3 classic.py up}
      kafka_bootstrap_servers: northwind_kafka:19092
      TZ: Asia/Tehran
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD_URI:?Run python3 classic.py up}@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?Run python3 classic.py up}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${WEB_SECRET:?Run python3 classic.py up}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Tehran
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Tehran
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__CORE__PARALLELISM: '3'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      PYTHONPATH: /opt/airflow/scripts
      SUNWAY_ENABLED: ${SUNWAY_ENABLED:-false}
      SUNWAY_USERNAME: ${SUNWAY_USERNAME:-}
      SUNWAY_PASSWORD: ${SUNWAY_PASSWORD:-}
      SUNWAY_RECIPIENT: ${SUNWAY_RECIPIENT:-}
      SUNWAY_SENDER: ${SUNWAY_SENDER:-}
    volumes:
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
    command:
    - scheduler
    - --pid
    - /opt/airflow/run/scheduler.pid
    restart: unless-stopped
    build:
      context: .
      dockerfile: airflow/Dockerfile
    tmpfs:
    - /opt/airflow/run:uid=50000,gid=0,mode=1777
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request as u; u.urlopen('http://localhost:8974/health',timeout=4)"
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 90s
  northwind_clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: northwind_classic_northwind_clickhouse
    environment:
      TZ: Asia/Tehran
      CLICKHOUSE_DB: northwind_dw
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run python3 classic.py up}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
    - 127.0.0.1:${CH_PORT:-8125}:8123
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    networks:
      default:
        aliases:
        - clickhouse
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  northwind_kafka:
    image: apache/kafka:3.9.2
    container_name: northwind_classic_northwind_kafka
    hostname: northwind_kafka
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data/logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Run python3 classic.py up}
      TZ: Asia/Tehran
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://northwind_kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@northwind_kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin";
    ports:
    - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    volumes:
    - northwind_kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 60s
  customer_cdc_reader:
    image: northwind-classic-cdc:1
    container_name: northwind_classic_customer_cdc_reader
    working_dir: /app
    environment:
      sql_server_host: northwind_sqlserver,1433
