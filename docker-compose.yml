      SUNWAY_RECIPIENT: ${SUNWAY_RECIPIENT:-}
      SUNWAY_SENDER: ${SUNWAY_SENDER:-}
    volumes:
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
