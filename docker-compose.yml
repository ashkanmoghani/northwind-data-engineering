      clickhouse_password: ${CLICKHOUSE_PASSWORD:?Run python3 classic.py up}
      kafka_bootstrap_servers: northwind_kafka:19092
      TZ: Asia/Tehran
      SUNWAY_ENABLED: ${SUNWAY_ENABLED:-false}
      SUNWAY_USERNAME: ${SUNWAY_USERNAME:-}
      SUNWAY_PASSWORD: ${SUNWAY_PASSWORD:-}
      SUNWAY_RECIPIENT: ${SUNWAY_RECIPIENT:-}
      SUNWAY_SENDER: ${SUNWAY_SENDER:-}
    command:
    - python
    - -u
    - /app/run_service.py
    - customer_cdc_reader
    depends_on:
      northwind_sqlserver:
        condition: service_healthy
      northwind_postgres:
        condition: service_healthy
      northwind_kafka:
        condition: service_healthy
      northwind_clickhouse:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - stream
